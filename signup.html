<!DOCTYPE html>
<html>
<head>
    <title>Parking Slot Booking Platform - Signup</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
        }

        .container{
            width:900px;
            background:white;
            border-radius:15px;
            overflow:hidden;
            display:flex;
            box-shadow:0 5px 20px rgba(0,0,0,0.3);
        }

        .left{
            width:50%;
            background:#f5f5f5;
        }

        .left img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .right{
            width:50%;
            padding:40px;
        }

        h1{
            text-align:center;
            color:#2a5298;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:gray;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        .password-box{
            position:relative;
        }

        .eye{
            position:absolute;
            right:15px;
            top:15px;
            cursor:pointer;
        }

        button{
            width:100%;
            padding:12px;
            background:#2a5298;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            margin-top:10px;
        }

        button:hover{
            background:#1e3c72;
        }

        .login-link{
            text-align:center;
            margin-top:15px;
        }

        .login-link a{
            color:#2a5298;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="left">
        <img src="https://images.unsplash.com/photo-1506521781263-d8422e82f27a?w=800"
             alt="Parking">
    </div>

    <div class="right">

        <h1>🚗 Parking Slot Booking Platform</h1>

        <p class="subtitle">
            Smart & Easy Car Parking Management
        </p>

        <input
            type="text"
            id="name"
            placeholder="Enter Full Name">

        <input
            type="email"
            id="email"
            placeholder="Enter Email">

        <div class="password-box">
            <input
                type="password"
                id="password"
                placeholder="Enter Password">

            <span
                class="eye"
                onclick="togglePassword()">
                👁
            </span>
        </div>

        <button onclick="signup()">
            Register
        </button>

        <div class="login-link">
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </div>

    </div>

</div>

<script src="signup.js"></script>

<script>
function togglePassword(){

    const password =
        document.getElementById("password");

    if(password.type === "password"){
        password.type = "text";
    }
    else{
        password.type = "password";
    }
}
</script>

</body>
</html>
