<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .card {
            border: 1px solid #ccc;
            background: white;
            padding: 20px;
            margin: 10px;
            display: inline-block;
            width: 200px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th {
            background: #4CAF50;
            color: white;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<h1>Admin Dashboard</h1>

<div class="card">
    <h3>Total Users</h3>
    <h2 id="users">0</h2>
</div>

<div class="card">
    <h3>Total Bookings</h3>
    <h2 id="bookings">0</h2>
</div>

<div class="card">
    <h3>Available Slots</h3>
    <h2 id="available">0</h2>
</div>

<div class="card">
    <h3>Occupancy Rate</h3>
    <h2 id="occupancy">0%</h2>
</div>

<div class="card">
    <h3>Total Revenue</h3>
    <h2 id="revenue">₹0</h2>
</div>

<h2>Recent Bookings</h2>

<table>
    <thead>
        <tr>
           <th>User</th>
           <th>Slot</th>
           <th>Vehicle</th>
           <th>Date & Time</th>
        </tr>
    </thead>
    <tbody id="bookingTable">
    </tbody>
</table>

<h2>User Reviews</h2>

<table>
    <thead>
        <tr>
            <th>User</th>
            <th>Rating</th>
            <th>Comment</th>
        </tr>
    </thead>
    <tbody id="reviewTable">
    </tbody>
</table>

<script src="admin.js"></script>

</body>
</html>
